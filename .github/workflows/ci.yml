name: Ritvan POS checks

on:
  push:
    branches: ["main", "phase-2-api-integration", "fix/gross-profit-and-safe-installers", "ui/iterate-inspired-workspace"]
  pull_request:
    branches: ["main", "phase-2-api-integration", "ui/iterate-inspired-workspace"]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm --prefix client install --no-audit --no-fund
      - name: Build frontend
        run: npm --prefix client run build

  backend-syntax:
    name: Backend syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate API source files
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check server/src/migrations/runner.js
          node --check server/src/index.js
          node --check server/src/db.js
          node --check server/src/middleware/auth.js
          node --check server/src/middleware/permissions.js
          node --check server/src/routes/auth.js
          node --check server/src/routes/items.js
          node --check server/src/routes/sales.js
          node --check server/src/routes/credit.js
          node --check server/src/routes/categories.js
          node --check server/src/routes/customers.js
          node --check server/src/routes/suppliers.js
          node --check server/src/routes/purchases.js
          node --check server/src/routes/inventory.js
          node --check server/src/routes/transactions.js
          node --check server/src/routes/staff.js
          node --check server/src/routes/employees.js
          node --check server/src/routes/returns.js
          node --check server/src/routes/settings.js
          node --check server/src/routes/reports.js
          node --check server/src/routes/spendings.js
          node --check server/src/seed-admin.js
          node --check server/src/reset-user-password.js

  desktop-package-check:
    name: Desktop packaging smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund
      - name: Install API dependencies
        run: npm --prefix server install --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm --prefix client install --no-audit --no-fund
      - name: Build production frontend
        run: npm --prefix client run build
      - name: Package Electron app without installer
        run: npx electron-builder --linux --dir --publish never
